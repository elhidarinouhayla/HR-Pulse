version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: hrpulse-backend
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
    container_name: hrpulse-frontend
    ports:
      - "8501:8501"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"