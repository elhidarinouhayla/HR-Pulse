version: "3.9"

services:
  # eervice FastAPI (backend avec uv)
  app:
    build: .
    ports:
      - "8001:8000"
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    volumes:
      - .:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # service Frontend Next.js
  frontend:
    build: ../HR-Pulse-frontend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - app
    environment:
      NEXT_PUBLIC_API_URL: "http://app:8000"