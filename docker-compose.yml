services:
  
  # FastAPI Backend
  app:
    build: 
      context: .
      dockerfile: dockerfile
    container_name: hr-pulse-backend
    ports:
      - "8000:8000"
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AZURE_AI_ENDPOINT=${AZURE_AI_ENDPOINT}
      - AZURE_AI_KEY=${AZURE_AI_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=hr-pulse-backend
    env_file:
      - app/.env
    depends_on:
      - jaeger
    volumes:
      - .:/app

  # Next.js Frontend
  frontend:
    build:
      context: ../HR-Pulse-frontend/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: hr-pulse-frontend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000



    # Jaeger
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317" 